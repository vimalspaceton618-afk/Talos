name: AgentGuard Security Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red-team:
    name: Red-team suite and benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q agentguard

      - name: Run red-team regression tests
        run: python -m unittest -v agentguard.test_red_team

      - name: Run all standalone security-module tests
        run: |
          python -m agentguard.inbound_scanner
          python -m agentguard.outbound_dlp
          python -m agentguard.policy_engine
          python -m agentguard.agent_guard_middleware
          python -m agentguard.quarantine_manager

      - name: Generate benchmark report
        run: python -m agentguard.test_red_team --benchmark | tee red-team-benchmark.json

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentguard-red-team-benchmark-${{ github.sha }}
          path: red-team-benchmark.json
          if-no-files-found: ignore
          retention-days: 30
