[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Local-first security firewall proxy for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13,<3",
  "SQLAlchemy>=2.0,<3",
  "fastapi>=0.141,<1",
  "uvicorn>=0.52,<1",
  "streamlit>=1.50,<2",
  "pandas>=2.2,<3",
]

[tool.setuptools.packages.find]
include = ["agentguard*"]
